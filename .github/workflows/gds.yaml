name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    # Skip the template's auto-generated initial commit (info.yaml is still a placeholder)
    if: ${{ !(github.event.created && github.ref_name == github.event.repository.default_branch && github.event.head_commit.message == 'Initial commit') }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      # Report-only: copies key numbers from the flow logs into run annotations,
      # which can be read through the GitHub API. Runs even if the build failed,
      # never fails itself and changes nothing in the build.
      - name: Summarize results as annotations
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | tr '\n' '|' | sed -e 's/|$//' -e 's/|/%0A/g'; }
          logs=$(find . -path '*runs/*' -name '*.log' 2>/dev/null)
          stat=$(find . -path '*runs/*' -name 'stat*.rpt' 2>/dev/null | head -1)
          if [ -z "$logs" ]; then echo "::warning title=summary::no flow logs found"; exit 0; fi
          util=$(grep -hE 'Util(ization)?' $logs 2>/dev/null | grep -E 'GPL|INFO|ERROR' | tail -5 | enc)
          area=$( { [ -n "$stat" ] && grep -E 'Chip area|Number of cells' "$stat" | head -3; } | enc)
          errs=$(grep -hE '\[ERROR|^Error|ERROR:' $logs 2>/dev/null | head -5 | enc)
          echo "::notice title=utilization::${util:-none found}"
          echo "::notice title=synthesis::${area:-none found}"
          met=$(find . -path '*runs/*final*' -name 'metrics.csv' 2>/dev/null | head -1)
          tim=$( { [ -n "$met" ] && grep -E '^timing__(setup|hold)__(ws|tns),|^timing__(setup|hold)_vio__count,|^route__drc_errors,' "$met"; } | enc)
          echo "::notice title=timing::${tim:-none found}"
          [ -n "$errs" ] && echo "::error title=first errors::${errs}"
          # where the flow stopped: last step directories and any error-like lines
          rundir=$(find . -type d -path '*runs/wokwi' 2>/dev/null | head -1)
          if [ -n "$rundir" ]; then
            last=$(ls -1 "$rundir" | grep -E '^[0-9]+-' | sort -n | tail -4 | enc)
            echo "::notice title=last flow steps::${last:-none}"
            errl=$(grep -rhiE 'error|fail|violat' "$rundir"/*/*.log 2>/dev/null | grep -viE '0 error|no error|errors: 0|error_|ERRORS=0' | tail -8 | cut -c1-200 | enc)
            [ -n "$errl" ] && echo "::warning title=error lines::${errl}"
          fi
          exit 0

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
